[workspace]
members = ["crates/*", "plugins/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.3"
authors = ["René Coignard <contact@renecoignard.com>"]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/coignard/clippy"
publish = false

[workspace.dependencies]
clippy = { path = "crates/clippy" }
clippy-focus = { path = "plugins/focus" }
clippy-inbox = { path = "plugins/inbox" }
clippy-reminders = { path = "plugins/reminders" }
clippy-sleepy = { path = "plugins/sleepy" }

bitflags = "2.13"
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
enum-map = "3.1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
fastrand = "2.5"
global-hotkey = "0.9"
hound = "3.5"
icns = { version = "0.5", default-features = false, features = ["pngio"] }
jiff = { version = "0.2", features = ["serde"] }
log = "0.4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-quartz-core = { version = "0.3", default-features = false }
plist = "1.10"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skrifa = { version = "0.48", default-features = false, features = ["std"] }
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27"
textwrap = { version = "0.16", default-features = false }
thiserror = "2.0"
toml = "1.1"
unicode-linebreak = "0.1"
unicode-segmentation = "1.13"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
